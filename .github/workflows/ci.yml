name: CI

on:
  push:
    branches: [main, 'main-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 測試與端對端驗證
    # Pin the LTS image so GitHub's ubuntu-latest migration does not change the runner mid-cycle.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # 與 docker-compose.yml 對齊：MySQL 8 + Redis 7，資料庫名 joindrink
    services:
      mysql:
        image: mysql:8.0.42
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: joindrink
          MYSQL_USER: joindrink
          MYSQL_PASSWORD: joindrink
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=3s --health-retries=5

    env:
      # JWT 密鑰至少 64 字元（HS512），不足會在啟動時直接失敗
      JWT_SECRET: ci-only-secret-key-not-used-anywhere-else-0123456789-abcdefghijklmnop
      # 僅 CI 使用 mock 驗證與測試儲值。application.yml 的 sms.mode 預設為 firebase，這裡必須明確指定。
      SMS_MODE: mock
      WALLET_MOCK_TOPUP_ENABLED: 'true'
      # 其餘連線參數沿用 application.yml 的預設值（DB_NAME/DB_USERNAME/DB_PASSWORD 皆為 joindrink），
      # 上面的 services 已照 docker-compose.yml 建好同名資料庫與帳號
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
      API_BASE: http://127.0.0.1:8082
      FE_BASE: http://127.0.0.1:5500

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # gitleaks 需完整歷史才能比對 .gitleaksignore baseline

      # ── 第 0 層：Secret 掃描（防止金鑰進版控）─────────────────
      # .gitleaksignore 豁免的僅限「已撤銷」的歷史殘留（見該檔說明）；
      # 新外洩仍會直接讓 CI 變紅。
      - name: Secret 掃描（gitleaks）
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # ── 靜態檢查（不需要後端，先跑先報錯）──
      # 受版控的 .js 逐一做語法檢查（frontend/vendor 是第三方檔，略過）；
      # HTML 內嵌的 <script> 不在 node --check 的範圍內，改用 check-inline-scripts 檢查。
      - name: 靜態語法檢查（JS 與 HTML 內嵌 script）
        run: |
          git ls-files -z '*.js' | grep -zv '^frontend/vendor/' | xargs -0 -r -n1 node --check
          node scripts/ui/check-inline-scripts.js

      # ── 第一層：單元／整合測試（授權與金流的回歸防線）──
      # tee 另存一份輸出給下方的失敗摘要使用；pipefail 讓 mvn 失敗時步驟仍然失敗
      - name: mvn test
        shell: bash
        run: |
          set -o pipefail
          mvn -B test 2>&1 | tee "$RUNNER_TEMP/mvn-test.log"

      # 測試總計（類別／測試／失敗／錯誤／略過）以 annotation 印出，check-run 的 REST API 可讀取。
      # 略過的測試會讓這一步變紅：assumeTrue 不成立時測試是「略過」而不是「失敗」，
      # 步驟仍然是綠的，那樣的綠燈不代表該測試有驗到東西（實作見 scripts/ci/surefire_totals.py）。
      - name: 測試總計與略過檢查
        if: always()
        run: python3 scripts/ci/surefire_totals.py --fail-on-skipped

      # 測試失敗時把失敗的測試名稱與根因寫成 annotation（實作見 scripts/ci/failure_annotations.py）。
      # 步驟日誌需要登入 Actions 網頁才看得到，但 check-run annotation 可以用 REST API 讀取。
      - name: 失敗測試摘要（annotation）
        if: failure()
        run: python3 scripts/ci/failure_annotations.py surefire "$RUNNER_TEMP/mvn-test.log"

      - name: 打包
        run: mvn -B package -DskipTests

      # 覆蓋率只做摘要、不設門檻；沒有報告（pom 未產生 JaCoCo）就略過，不影響建置結果
      - name: JaCoCo 行覆蓋率摘要（僅供參考）
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ ! -f "$csv" ]; then echo "沒有 $csv，略過覆蓋率摘要"; exit 0; fi
          # 欄位 8 = LINE_MISSED、欄位 9 = LINE_COVERED；第 1 列是標題
          summary=$(awk -F, 'NR > 1 { m += $8; c += $9 } END { t = m + c; printf "%d / %d（%.1f%%）", c, t, (t ? c * 100 / t : 0) }' "$csv") || summary="無法解析 $csv"
          echo "JaCoCo 行覆蓋率：$summary"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '### JaCoCo 行覆蓋率\n\n覆蓋行數：%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 起服務 ──
      - name: 啟動後端
        run: |
          nohup java -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$API_BASE/api/stores/nearby?lat=25&lng=121" || true)
            [ "$code" = "200" ] && { echo "後端就緒（$((i*2))s）"; exit 0; }
            sleep 2
          done
          echo "後端啟動逾時，log："; tail -50 app.log; exit 1

      - name: 啟動靜態前端
        run: |
          nohup python3 -m http.server 5500 --bind 127.0.0.1 --directory frontend > /tmp/fe.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf "$FE_BASE/Customer/index.html" >/dev/null && { echo "前端就緒"; exit 0; }
            sleep 1
          done
          echo "前端啟動逾時"; exit 1

      # ── 第二層：API 端對端（12 個面向；通過數由腳本輸出）──
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 安裝驗證腳本的相依套件
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: API 端對端驗證
        working-directory: scripts
        shell: bash
        run: |
          set -o pipefail
          node e2e-verify.js 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      # ── 第三層：實際操作 UI 的流程驗證 ──
      - name: 安裝 Chromium
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      # E2E_OFFLINE=1：把所有連外請求擋掉。第三方函式庫都收在 frontend/vendor/，
      # 所以斷網狀態下畫面必須完全正常。有人重新引入 CDN 的話，這一步就會紅。
      - name: UI 流程驗證（斷網模式：全頁面普掃 + 點餐 + 轉盤 + 揪團）
        working-directory: scripts
        shell: bash
        env:
          E2E_OFFLINE: '1'
        run: |
          set -o pipefail
          node ui/run-all.js 2>&1 | tee "$RUNNER_TEMP/ui.log"

      # 端對端、UI 與後端的失敗原因也寫成 annotation（後端取 app.log 的 ERROR 行與其後的 Caused by:）
      - name: 失敗原因摘要（annotation）
        if: failure()
        run: python3 scripts/ci/failure_annotations.py checks "$RUNNER_TEMP/e2e.log" "$RUNNER_TEMP/ui.log" app.log

      # 失敗時把截圖與後端 log 帶出來，才有辦法判讀
      - name: 上傳失敗時的截圖與日誌
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: |
            target/e2e-shots/
            app.log
          retention-days: 7
          if-no-files-found: ignore

  # 只驗證 Dockerfile 能建成映像：不推送、不帶任何憑證
  docker:
    name: 容器映像建置（僅建置）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: docker build
        run: docker build -t joindrink:ci .
