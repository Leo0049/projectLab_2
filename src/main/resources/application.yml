# JoinDrink 主設定檔
#
# 原則：不放明文密鑰。所有敏感值改由環境變數注入，冒號後的預設值僅供
#       「本機 docker compose up」開箱即用，正式環境請務必以環境變數覆寫。
#
# 本機啟動：docker compose up -d 之後，另設 SMS_MODE=mock（或在 application-local.yml 設 sms.mode: mock）即可跑。
#          sms.mode 的預設是 firebase（fail-closed），漏設時不會進入 mock。

server:
  port: ${SERVER_PORT:8082}
  # 反向代理之後取得真實來源 IP。只信任可信代理（Tomcat RemoteIpValve 的預設清單：私有網段與 127.0.0.1）送來的 X-Forwarded-*；
  # 直連時標頭一律忽略，因此攻擊者無法用偽造的 X-Forwarded-For 繞過登入限流（ADR-0004）。
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}

spring:
  application:
    name: joindrink

  security:
    user:
      name: none

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # ── 本機 MySQL（docker-compose.yml 提供）─────────────────
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:joindrink}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:joindrink}
    password: ${DB_PASSWORD:joindrink}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000        # 10分鐘沒用就釋放
      max-lifetime: 1800000       # 連線最長存活 30分鐘（要比 MySQL wait_timeout 短）
      connection-timeout: 30000   # 等待連線最多 30秒
      keepalive-time: 60000       # 每 60秒 ping 一次保持連線

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # 懶載入關聯依 50 筆一批載入，降低 N+1（ADR-0002：open-in-view 維持關閉）
        default_batch_fetch_size: 50
        jdbc:
          time_zone: Asia/Taipei

  # ── 真實 Redis（docker-compose.yml 提供，已停用 embedded-redis）──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 1
          max-wait: 2000ms

firebase:
  # 支援 classpath: 與 file: 兩種前綴；金鑰缺失時只會停用社群登入，不影響其他功能
  config-path: ${FIREBASE_CONFIG_PATH:classpath:serviceAccountKey.json}

# ⚠️ AuthService 讀的是 sms.mode（非 app.sms.mode），必須放在頂層才會生效
#
# mock 模式會把 MOCK_TOKEN 視為「手機已驗證」，公開的 /api/auth/reset-password-firebase
# 因此能對任何號碼重設密碼（＝帳號接管）。因此：
#   1. 預設為 firebase（fail-closed）：沒有明確設定 SMS_MODE 時，MOCK_TOKEN 一律不被接受；
#      本機與 CI 必須自行設定 SMS_MODE=mock（見 application-local.yml.example 與 .github/workflows/ci.yml）；
#   2. prod profile 下 AuthService 啟動时就檢查本值必須為 firebase，不符即啟動失敗。
sms:
  mode: ${SMS_MODE:firebase}      # firebase：實際驗證（預設，正式環境必須）／mock：跳過 Firebase 手機驗證，僅供本機與 CI

# 管理員帳號的首次建立（N-28）。兩者都設定時，啟動時若該帳號尚不存在就建立一筆。
# 密碼只接受 BCrypt 雜湊（以 $2a$、$2b$ 或 $2y$ 開頭），不接受明文；建立後應從環境變數移除。
admin:
  bootstrap:
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password-hash: ${ADMIN_BOOTSTRAP_PASSWORD_HASH:}

app:
  reset_password_url: ${RESET_PASSWORD_URL:http://localhost:5173/Resetpassword}
  upload:
    # 未設定 Cloudinary 憑證時，圖片改存到這個目錄，並由 WebConfig 以 /uploads/** 提供。
    # 因此不需要任何第三方帳號也能使用頭像、品牌 logo、門市封面與優惠券圖片。
    local-dir: ${UPLOAD_LOCAL_DIR:uploads}
  demo-data:
    # 首次啟動且資料表為空時，植入示範品牌/門市/飲品/顧客，讓專案 clone 下來就能看到畫面。
    # ⚠️ 會建立密碼已知（demo1234）的示範帳號。除了設 false 之外，
    #    DemoDataSeeder 在 prod profile 下一律不植入（双保險）。
    enabled: ${DEMO_DATA_ENABLED:true}
  wallet:
    mock-top-up:
      # 此功能只供本機展示，不會代替實際付款。正式環境一律拒絕此功能。
      enabled: ${WALLET_MOCK_TOPUP_ENABLED:false}
  security:
    csp:
      # ⚠️ CSP 預設關閉。本專案頁面全是 inline event handler 與 inline <script>，
      #    一旦開啟就必須放寬 script-src（'unsafe-inline'），否則頁面全數失效；
      #    而 'unsafe-inline' 對注入 inline handler 這類 XSS 幾乎沒有攔阻效果。
      #    要真正收緊請先把 inline handler 外部化，再依 docs/DEPLOYMENT.md 的政策範例開啟。
      enabled: ${CSP_ENABLED:false}
      # 啟用時送出的政策；預設值已放寬到足以支援現有頁面（地圖、Cloudinary、Firebase、WS）
      policy: "${CSP_POLICY:default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: ws: wss:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'}"
  cors:
    # SecurityConfig（HTTP）與 WebSocketConfig（STOMP handshake）共用這份白名單，
    # 避免兩邊各寫一份而漂移——WebSocket 曾寫成 allowedOriginPatterns("*") 完全放行。
    #
    # 預設列出：本專案前端的靜態伺服器（localhost／127.0.0.1 的 5500；CI 與 scripts/ 的 FE_BASE 預設即此埠）、
    # 本機後端（8082），以及 localhost:5173（Vite 的預設埠；本專案前端是靜態 HTML、不使用 Vite，
    # 此埠目前沒有程式依賴，確認無人使用後可移除）。
    # IDE 的臨時埠等其他來源，請寫在 application-local.yml（範例見 application-local.yml.example），不要改這裡的預設值。
    # 直接以 file:// 開啟頁面（Origin: null）不受支援，請用靜態伺服器。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500,http://localhost:8082,http://127.0.0.1:8082}

jwt:
  # 本機預設值僅供開發，正式環境務必以 JWT_SECRET 覆寫。
  # ⚠️ HS512 需 ≥64 個字元（以 UTF-8 原始位元組計算，非 Base64 解碼後長度）；
  #    不足時 JwtUtils 會在「啟動時」直接失敗，而不是等到登入才拋 500。
  secret: ${JWT_SECRET:LocalDevOnlySecretForJoinDrinkDoNotUseInProductionMustBeAtLeast64Chars!}
  expiration: ${JWT_EXPIRATION:86400000}   # 24 小時

# 💡 Cloudinary 設定（無環境變數時停用上傳，不會導致啟動失敗）
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# 💡 優惠券模板底圖
coupon:
  template-url: ${COUPON_TEMPLATE_URL:}

# ── 健康檢查（Actuator）──────────────────────────────────
# 只暴露 health，且不顯示細節：DB／Redis 的內部狀態不對外。GET /actuator/health 不需登入（SecurityConfig）。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  # %X{requestId}：RequestIdFilter 放入 MDC 的請求編號；請求之外的日誌顯示 --
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:--}] %logger{36} - %msg%n"
  level:
    org.springframework.data.redis: WARN
