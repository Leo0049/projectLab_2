# JoinDrink 主設定檔
#
# 原則：不放明文密鑰。所有敏感值改由環境變數注入，冒號後的預設值僅供
#       「本機 docker compose up」開箱即用，正式環境請務必以環境變數覆寫。
#
# 本機啟動：docker compose up -d 之後直接跑，不需額外設定。

server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: joindrink

  security:
    user:
      name: none

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # ── 本機 MySQL（docker-compose.yml 提供）─────────────────
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:joindrink}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:joindrink}
    password: ${DB_PASSWORD:joindrink}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000        # 10分鐘沒用就釋放
      max-lifetime: 1800000       # 連線最長存活 30分鐘（要比 MySQL wait_timeout 短）
      connection-timeout: 30000   # 等待連線最多 30秒
      keepalive-time: 60000       # 每 60秒 ping 一次保持連線

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Taipei

  # ── 真實 Redis（docker-compose.yml 提供，已停用 embedded-redis）──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 1
          max-wait: 2000ms

firebase:
  # 支援 classpath: 與 file: 兩種前綴；金鑰缺失時只會停用社群登入，不影響其他功能
  config-path: ${FIREBASE_CONFIG_PATH:classpath:serviceAccountKey.json}

# ⚠️ AuthService 讀的是 sms.mode（非 app.sms.mode），必須放在頂層才會生效
sms:
  mode: ${SMS_MODE:mock}          # mock：跳過 Firebase 手機驗證 / firebase：實際驗證

app:
  reset_password_url: ${RESET_PASSWORD_URL:http://localhost:5173/Resetpassword}
  upload:
    # 未設定 Cloudinary 憑證時，圖片改存到這個目錄，並由 WebConfig 以 /uploads/** 提供。
    # 因此不需要任何第三方帳號也能使用頭像、品牌 logo、門市封面與優惠券圖片。
    local-dir: ${UPLOAD_LOCAL_DIR:uploads}
  demo-data:
    # 首次啟動且資料表為空時，植入示範品牌/門市/飲品/顧客，讓專案 clone 下來就能看到畫面。
    # ⚠️ 會建立密碼已知的示範帳號，正式環境務必設為 false。
    enabled: ${DEMO_DATA_ENABLED:true}
  cors:
    # SecurityConfig（HTTP）與 WebSocketConfig（STOMP handshake）共用這份白名單，
    # 避免兩邊各寫一份而漂移——WebSocket 曾寫成 allowedOriginPatterns("*") 完全放行。
    #
    # ⚠️ 這裡多列了 5501/5502/3000/8080：VS Code Live Server 的預設埠是 5500，
    # 但 5500 被占用時它會靜默改用 5501，此時整個前端會因為 CORS 而全部 403——
    # 實測 5501 / 3000 / 8080 與 file://（Origin: null）的 preflight 都被擋下。
    # 直接用瀏覽器開檔案（file://）本來就不支援，請用靜態伺服器。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:5501,http://localhost:5501,http://127.0.0.1:5502,http://localhost:5502,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,http://localhost:60687,http://localhost:54376,http://localhost:63342,http://localhost:8082,http://127.0.0.1:8082}

jwt:
  # 本機預設值僅供開發，正式環境務必以 JWT_SECRET 覆寫。
  # ⚠️ HS512 需 ≥64 個字元（以 UTF-8 原始位元組計算，非 Base64 解碼後長度）；
  #    不足時 JwtUtils 會在「啟動時」直接失敗，而不是等到登入才拋 500。
  secret: ${JWT_SECRET:LocalDevOnlySecretForJoinDrinkDoNotUseInProductionMustBeAtLeast64Chars!}
  expiration: ${JWT_EXPIRATION:86400000}   # 24 小時

# 💡 Cloudinary 設定（無環境變數時停用上傳，不會導致啟動失敗）
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# 💡 優惠券模板底圖
coupon:
  template-url: ${COUPON_TEMPLATE_URL:}

logging:
  level:
    org.springframework.data.redis: WARN
