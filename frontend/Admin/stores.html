<!DOCTYPE html>

<html class="light" lang="zh-TW">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="noindex, nofollow" name="robots" />
    <title>JOIN揪飲 - 管理員後台 · 分店管理</title>
    <script src="../vendor/tailwind.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="../vendor/material-symbols/material-symbols.css" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>

<body class="min-h-screen bg-background-light font-display text-slate-900 antialiased">
    <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 backdrop-blur">
        <div class="mx-auto flex max-w-4xl items-center justify-between gap-3 px-4 py-3">
            <div class="flex min-w-0 items-center gap-2">
                <span class="material-symbols-outlined text-primary">admin_panel_settings</span>
                <span class="truncate font-semibold">JOIN揪飲 管理員後台</span>
            </div>
            <button id="logout-btn" type="button"
                class="inline-flex shrink-0 items-center gap-1 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100">
                <span class="material-symbols-outlined text-[18px]">logout</span>
                登出
            </button>
        </div>
        <nav aria-label="管理員功能" class="mx-auto flex max-w-4xl gap-2 px-4 pb-3 text-sm font-medium">
            <a href="brands.html"
                class="rounded-lg px-3 py-1.5 text-slate-600 hover:bg-slate-100">待審核品牌</a>
            <a href="managed.html"
                class="rounded-lg bg-primary px-3 py-1.5 text-white">已核准品牌</a>
        </nav>
    </header>

    <main class="mx-auto max-w-4xl px-4 py-6">
        <a href="managed.html"
            class="inline-flex items-center gap-1 text-sm font-medium text-slate-500 hover:text-slate-800">
            <span class="material-symbols-outlined text-[18px]">arrow_back</span>
            回到已核准品牌
        </a>

        <div class="mt-3 flex flex-wrap items-end justify-between gap-3">
            <div class="min-w-0">
                <p class="text-sm text-slate-500">分店管理</p>
                <h1 id="page-title" class="truncate text-2xl font-bold">分店清單</h1>
                <p id="store-count" class="mt-1 text-sm text-slate-500">載入中…</p>
            </div>
            <button id="refresh-btn" type="button"
                class="inline-flex items-center gap-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium hover:bg-slate-50 disabled:opacity-50">
                <span class="material-symbols-outlined text-[18px]">refresh</span>
                重新整理
            </button>
        </div>

        <div id="brand-banner" class="mt-4 hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700 ring-1 ring-red-200">
            此品牌已停用，底下所有分店都無法使用。要恢復分店前，請先到「已核准品牌」恢復品牌。
        </div>

        <div id="store-status" role="status" aria-live="polite" class="mt-4 hidden rounded-lg px-4 py-3 text-sm"></div>

        <ul id="store-list" class="mt-4 space-y-3"></ul>

        <p id="store-empty" class="mt-10 hidden rounded-xl border border-dashed border-slate-300 bg-white px-6 py-12 text-center text-slate-500">這個品牌還沒有分店</p>

        <nav id="pager" class="mt-6 hidden">
            <div class="flex items-center justify-between gap-3">
                <button id="prev-page" type="button"
                    class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40">上一頁</button>
                <span id="page-info" class="text-sm text-slate-500"></span>
                <button id="next-page" type="button"
                    class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40">下一頁</button>
            </div>
        </nav>
    </main>

    <script src="js/admin-api.js"></script>
    <script src="js/admin-stores.js"></script>
</body>

</html>
