<!DOCTYPE html>

<html class="light" lang="zh-TW">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="noindex, nofollow" name="robots" />
    <title>JOIN揪飲 - 管理員登入</title>
    <script src="../vendor/tailwind.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="../vendor/material-symbols/material-symbols.css" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>

<body class="min-h-screen bg-background-light font-display text-slate-900 antialiased">
    <main class="flex min-h-screen items-center justify-center px-4 py-10">
        <div class="w-full max-w-sm">
            <div class="mb-6 text-center">
                <span class="material-symbols-outlined text-5xl text-primary">admin_panel_settings</span>
                <h1 class="mt-2 text-2xl font-bold">管理員登入</h1>
                <p class="mt-1 text-sm text-slate-500">JOIN揪飲 平台管理後台</p>
            </div>

            <form id="admin-login-form" novalidate class="space-y-4 rounded-xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
                <div id="admin-login-error" role="alert" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></div>

                <div>
                    <label for="admin-username" class="mb-1 block text-sm font-medium text-slate-700">帳號</label>
                    <input id="admin-username" name="username" type="text" autocomplete="username" maxlength="64"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30" />
                </div>

                <div>
                    <label for="admin-password" class="mb-1 block text-sm font-medium text-slate-700">密碼</label>
                    <input id="admin-password" name="password" type="password" autocomplete="current-password"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30" />
                </div>

                <button id="admin-login-submit" type="submit"
                    class="w-full rounded-lg bg-primary px-4 py-2.5 font-semibold text-white hover:opacity-90 disabled:opacity-60">登入</button>
            </form>
        </div>
    </main>

    <script src="js/admin-api.js"></script>
    <script src="js/admin-login.js"></script>
</body>

</html>
