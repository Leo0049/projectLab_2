<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重設密碼 | JOIN揪飲</title>

  <link rel="stylesheet" href="./css/login.css">
  <link rel="stylesheet" href="../../vendor/font-awesome/css/all.min.css">
</head>

<body>

  <header class="header">
    <div class="logo">
      <img src="./images/logo.png" alt="JOIN 揪飲 LOGO" class="logo-img">
    </div>
  </header>

  <section class="login-section">
    <div class="login-card">

      <h2>重設密碼</h2>
      <p class="login-desc">請輸入新密碼，完成後即可使用新密碼登入。</p>

      <form class="login-form" id="reset-password-form">

        <label>新密碼</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="new-password" placeholder="請設定 8-16 位英數組合密碼" autocomplete="new-password" />
          <i class="fa-regular fa-eye" id="toggle-new-password"></i>
        </div>

        <label>確認新密碼</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="confirm-password" placeholder="請再輸入一次新密碼" autocomplete="new-password" />
          <i class="fa-regular fa-eye" id="toggle-confirm-password"></i>
        </div>

        <!-- 錯誤訊息 -->
        <p id="reset-error" style="display:none; color:#e53e3e; font-size:0.875rem; margin-bottom:8px;"></p>

        <button type="submit" class="login-btn" id="reset-submit-btn">確認重設</button>

      </form>

      <p class="register-link">
        <a href="login.html">返回登入</a>
      </p>

    </div>
  </section>

  <footer class="footer">
    © 2024 JOIN 揪飲. All rights reserved.
  </footer>

  <!-- 成功彈窗 -->
  <div class="modal-overlay" id="success-modal" aria-hidden="true">
    <div class="modal-card">
      <h3>密碼已重設成功</h3>
      <p>將於 <span id="countdown">3</span> 秒後自動前往登入頁。</p>
      <button class="login-btn" id="modal-ok">立即前往登入</button>
    </div>
  </div>

  <!-- 密碼不一致彈窗 -->
  <div class="modal-overlay" id="error-modal" aria-hidden="true">
    <div class="modal-card">
      <h3>密碼不一致</h3>
      <p>請確認兩次輸入的密碼是否相同，再試一次。</p>
      <button class="login-btn" id="modal-error-ok">我知道了</button>
    </div>
  </div>

  <script>
    window.JOIN_API_BASE = 'http://localhost:8082';
  </script>

  <script>
    const API_BASE = (function resolveApiBase() {
      if (window.JOIN_API_BASE && typeof window.JOIN_API_BASE === 'string')
        return window.JOIN_API_BASE.replace(/\/$/, '');
      const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (location.protocol === 'file:' || (isLocalhost && location.port !== '8082'))
        return 'http://localhost:8082';
      return location.origin;
    })();

    // ─── 密碼顯示切換 ──────────────────────────────────────────
    function togglePasswordVisibility(toggleId, inputId) {
      const toggle = document.getElementById(toggleId);
      const input  = document.getElementById(inputId);
      if (!toggle || !input) return;
      toggle.addEventListener('click', () => {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        toggle.classList.toggle('fa-eye-slash', isPassword);
        toggle.classList.toggle('fa-eye', !isPassword);
      });
    }

    // ─── Modal 工具 ─────────────────────────────────────────────
    let countdownTimer = null;

    function openSuccessModal() {
      const modal       = document.getElementById('success-modal');
      const countdownEl = document.getElementById('countdown');
      if (!modal || !countdownEl) return;

      let remaining = 3;
      countdownEl.textContent = String(remaining);

      countdownTimer = setInterval(() => {
        remaining -= 1;
        countdownEl.textContent = String(remaining);
        if (remaining <= 0) {
          clearInterval(countdownTimer);
          location.href = 'login.html';
        }
      }, 1000);

      modal.setAttribute('aria-hidden', 'false');
      modal.classList.add('open');
    }

    function openErrorModal() {
      const modal = document.getElementById('error-modal');
      if (!modal) return;
      modal.setAttribute('aria-hidden', 'false');
      modal.classList.add('open');
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (!modal) return;
      modal.setAttribute('aria-hidden', 'true');
      modal.classList.remove('open');
    }

    function showError(msg) {
      const el = document.getElementById('reset-error');
      if (!el) return;
      el.textContent = msg;
      el.style.display = 'block';
    }

    function clearError() {
      const el = document.getElementById('reset-error');
      if (el) el.style.display = 'none';
    }

    // ─── 主邏輯 ─────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      togglePasswordVisibility('toggle-new-password', 'new-password');
      togglePasswordVisibility('toggle-confirm-password', 'confirm-password');

      // 從 URL 取得 phone，從 localStorage 取得 idToken
      const urlParams = new URLSearchParams(location.search);
      const phone     = urlParams.get('phone') || '';

      const resetData = JSON.parse(localStorage.getItem('JOIN_RESET_TOKEN') || '{}');
      const idToken   = resetData?.idToken || '';

      // ✅ 放行 MOCK_TOKEN（測試模式），正式 JWT 則驗證格式（3 段 Base64）
      const isValidToken = idToken === 'MOCK_TOKEN' ||
        (typeof idToken === 'string' && idToken.split('.').length === 3);

      if (!idToken || !isValidToken) {
        alert('驗證資料已失效或遺失，請重新進行手機驗證');
        location.href = 'forgot-password.html';
        return;
      }

      const form      = document.getElementById('reset-password-form');
      const submitBtn = document.getElementById('reset-submit-btn');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearError();

        const newPassword     = document.getElementById('new-password')?.value;
        const confirmPassword = document.getElementById('confirm-password')?.value;

        // 基本驗證
        if (!newPassword || !confirmPassword) {
          showError('請填寫兩個密碼欄位');
          return;
        }
        if (newPassword.length < 8 || newPassword.length > 16) {
          showError('密碼請設定 8～16 位英數組合');
          return;
        }
        if (newPassword !== confirmPassword) {
          openErrorModal();
          return;
        }

        submitBtn.disabled    = true;
        submitBtn.textContent = '重設中…';

        try {
          const res  = await fetch(`${API_BASE}/api/auth/reset-password-firebase`, {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ idToken, phone, newPassword })
          });
          const data = await res.json();

          if (data?.code === '200') {
            // 清除已用過的 token
            localStorage.removeItem('JOIN_RESET_TOKEN');
            openSuccessModal();
            return;
          }

          // ✅ Firebase token 相關錯誤給友善提示
          const msg = data?.msg || '';
          if (msg.includes('Firebase') || msg.includes('JWT') || msg.includes('token') || data?.code === '401') {
            showError('驗證已過期，請返回重新進行手機驗證');
          } else {
            showError(msg || '重設失敗，請稍後再試');
          }

        } catch (err) {
          console.error(err);
          showError('網路錯誤，請確認連線後再試');
        } finally {
          submitBtn.disabled    = false;
          submitBtn.textContent = '確認重設';
        }
      });

      // Modal 按鈕
      document.getElementById('modal-ok')?.addEventListener('click', () => {
        if (countdownTimer) clearInterval(countdownTimer);
        location.href = 'login.html';
      });

      document.getElementById('modal-error-ok')?.addEventListener('click', () => {
        closeModal('error-modal');
      });
    });
  </script>

</body>

</html>
