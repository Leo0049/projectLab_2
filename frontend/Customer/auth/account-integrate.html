<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會員整合服務 | JOIN揪飲</title>

  <link rel="stylesheet" href="./css/login.css" />
  <link rel="stylesheet" href="../../vendor/font-awesome/css/all.min.css" />
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="./images/logo.png" alt="JOIN 揪飲 LOGO" class="logo-img" />
    </div>
  </header>

  <section class="login-section">
    <div class="login-card">
      <h2>會員整合服務</h2>
      <p class="login-desc">會員帳號整合，多元登入，統一累點！</p>

      <form class="login-form" id="integrate-form" onsubmit="return false;">
        <label>手機號碼</label>
        <div class="input-box">
          <i class="fa-solid fa-mobile-screen"></i>
          <input type="text" id="integrate-phone" placeholder="請輸入手機號碼" inputmode="tel" />
        </div>

        <p class="login-desc" style="font-size:12px; margin-top:-10px; margin-bottom:16px; color:#999;">只支援台灣手機號碼</p>

        <p id="integrate-error" style="display:none; color:#e53e3e; font-size:0.875rem; margin-bottom:8px;"></p>

        <button type="button" class="login-btn" id="integrate-confirm">確認</button>
      </form>
    </div>
  </section>

  <footer class="footer">
    © 2024 JOIN 揪飲. All rights reserved.
  </footer>

  <script>
    window.JOIN_API_BASE = 'http://localhost:8082';
  </script>

  <script>
    const API_BASE = (function resolveApiBase() {
      if (window.JOIN_API_BASE && typeof window.JOIN_API_BASE === 'string')
        return window.JOIN_API_BASE.replace(/\/$/, '');
      const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (location.protocol === 'file:' || (isLocalhost && location.port !== '8082'))
        return 'http://localhost:8082';
      return location.origin;
    })();

    function postJson(path, payload) {
      return fetch(`${API_BASE}${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(async (res) => {
        const raw = await res.text();
        let data;
        try { data = raw ? JSON.parse(raw) : null; } catch { data = null; }
        if (!res.ok) {
          const msg = data?.msg || data?.message || raw || `HTTP ${res.status}`;
          throw new Error(msg);
        }
        return data;
      });
    }

    function showError(msg) {
      const el = document.getElementById('integrate-error');
      if (!el) return;
      el.textContent = msg;
      el.style.display = 'block';
    }
    function clearError() {
      const el = document.getElementById('integrate-error');
      if (el) el.style.display = 'none';
    }

    const qs       = new URLSearchParams(location.search);
    const provider = qs.get('provider') || 'GOOGLE';
    const source   = qs.get('source')   || 'login';
    const pending  = JSON.parse(localStorage.getItem('JOIN_SOCIAL_PENDING') || '{}');

    const phoneInput   = document.getElementById('integrate-phone');
    const confirmBtn   = document.getElementById('integrate-confirm');
    const prefillPhone = qs.get('phone') || pending.phone || '';
    if (phoneInput && prefillPhone) phoneInput.value = prefillPhone;

    confirmBtn.addEventListener('click', async function () {
      clearError();
      const phone = phoneInput.value.trim();

      if (!phone) { showError('請輸入手機號碼'); return; }
      if (!/^09\d{8}$/.test(phone)) {
        showError('請輸入 09 開頭的 10 位台灣手機號碼');
        return;
      }

      if (pending?.idToken) {
        pending.phone    = phone;
        pending.provider = provider;
        localStorage.setItem('JOIN_SOCIAL_PENDING', JSON.stringify(pending));
      }

      confirmBtn.disabled    = true;
      confirmBtn.textContent = '處理中…';

      try {
        // Step 1：確認此手機是否已有帳號
        const checkRes  = await fetch(`${API_BASE}/api/auth/check-phone?phone=${encodeURIComponent(phone)}`);
        const checkData = await checkRes.json();
        const isRegistered = Boolean(checkData?.data);

        if (isRegistered) {
          // 手機已有傳統帳號 → 走密碼驗證整合流程
          window.location.href =
            `account-verify.html?phone=${encodeURIComponent(phone)}&provider=${encodeURIComponent(provider)}&source=${encodeURIComponent(source)}`;
          return;
        }

        // Step 2：全新手機 → 呼叫 social-login 建立帳號並直接完成
        if (!pending?.idToken) {
          showError('第三方登入資訊遺失，請重新點選 Google / Facebook');
          return;
        }

        const socialResult = await postJson('/api/auth/social-login', {
          idToken:  pending.idToken,
          phone,
          name:     pending.name || phone,
          provider
        });

        if (socialResult?.code === '200') {
          // 帳號已建立（寫入 DB），先存 token 再走手機 OTP 驗證確認手機屬於本人
          const token  = socialResult?.data?.token;
          const name   = socialResult?.data?.name   || '';
          const userId = socialResult?.data?.userId  || '';
          if (token) {
            localStorage.setItem('JOIN_TOKEN',     token);
            localStorage.setItem('JOIN_USER_NAME', name);
            localStorage.setItem('JOIN_USER_ID',   String(userId));
          }
          localStorage.removeItem('JOIN_SOCIAL_PENDING');
          // type=social-signup：帳號已建立，OTP 通過後直接到 register-success
          window.location.href =
            `verify-phone.html?type=social-signup&phone=${encodeURIComponent(phone)}`;
          return;
        }

        if (socialResult?.code === '203') {
          // 競態：手機剛被搶先註冊 → 走整合流程
          window.location.href =
            `account-verify.html?phone=${encodeURIComponent(phone)}&provider=${encodeURIComponent(provider)}&source=${encodeURIComponent(source)}`;
          return;
        }

        showError(socialResult?.msg || '第三方帳號建立失敗，請稍後再試');

      } catch (err) {
        console.error(err);
        showError(err?.message || '查詢 / 建立失敗，請確認網路連線');
      } finally {
        confirmBtn.disabled    = false;
        confirmBtn.textContent = '確認';
      }
    });

    phoneInput?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); confirmBtn.click(); }
    });
  </script>
</body>

</html>
