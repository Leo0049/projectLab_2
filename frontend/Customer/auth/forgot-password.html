<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <title>忘記密碼 | JOIN揪飲</title>

  <link rel="stylesheet" href="./css/login.css">
  <link rel="stylesheet" href="../../vendor/font-awesome/css/all.min.css">
</head>

<body>

  <header class="header">
    <div class="logo">
      <img src="./images/logo.png" alt="JOIN 揪飲 LOGO" class="logo-img">
    </div>
  </header>

  <section class="login-section">
    <div class="login-card">

      <h2>忘記密碼</h2>
      <p class="login-desc">請輸入您註冊時使用的手機號碼，我們將發送驗證碼供您重設密碼。</p>

      <form class="login-form" onsubmit="return false;">

        <label>手機號碼</label>
        <div class="input-box">
          <i class="fa-solid fa-mobile-screen"></i>
          <input type="text" id="reset-phone" placeholder="請輸入您的手機號碼" inputmode="tel" />
        </div>

        <!-- 錯誤訊息 -->
        <p id="reset-phone-error" style="display:none; color:#e53e3e; font-size:0.875rem; margin-bottom:8px;"></p>

        <button type="button" class="login-btn" id="send-reset">發送驗證碼</button>

      </form>

      <p class="register-link">
        回到 <a href="login.html">登入頁面</a>
      </p>

    </div>
  </section>

  <footer class="footer">
    © 2024 JOIN 揪飲. All rights reserved.
  </footer>

  <script>
    window.JOIN_API_BASE = 'http://localhost:8082';
    window.JOIN_FIREBASE_CONFIG = {
      apiKey: "AIzaSyCFQlAen8XIY0VTxzl0usNvz-FxO-gsRZM",
      authDomain: "project-b5e05.firebaseapp.com",
      projectId: "project-b5e05",
      storageBucket: "project-b5e05.firebasestorage.app",
      messagingSenderId: "302990497638",
      appId: "1:302990497638:web:4ad06a28fce00b5e5d5aa7",
      measurementId: "G-EZ7MPPE8ZN"
    };
  </script>

  <script>
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src; s.async = true;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error(`無法載入 ${src}`));
        document.head.appendChild(s);
      });
    }
    async function tryLoadFirebase() {
      const candidates = [
        'https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js',
        'https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js',
        'https://cdn.jsdelivr.net/npm/firebase@10.14.0/compat/app.js',
        'https://cdn.jsdelivr.net/npm/firebase@10.14.0/compat/auth.js',
        'https://cdnjs.cloudflare.com/ajax/libs/firebase/10.14.0/firebase-app-compat.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/firebase/10.14.0/firebase-auth-compat.min.js'
      ];
      for (let i = 0; i < candidates.length; i += 2) {
        try { await loadScript(candidates[i]); await loadScript(candidates[i + 1]); return; }
        catch (err) { console.warn('Firebase CDN 失敗，嘗試下一個：', err.message); }
      }
      throw new Error('所有 Firebase CDN 載入失敗');
    }
    (async () => {
      try {
        await tryLoadFirebase();
        if (!window.firebase) throw new Error('firebase global 尚未建立');
        if (window.JOIN_FIREBASE_CONFIG && !window.firebase.apps?.length)
          firebase.initializeApp(window.JOIN_FIREBASE_CONFIG);
      } catch (err) {
        console.error('Firebase 載入失敗', err);
      }
    })();
  </script>

  <script>
    const API_BASE = (function resolveApiBase() {
      if (window.JOIN_API_BASE && typeof window.JOIN_API_BASE === 'string')
        return window.JOIN_API_BASE.replace(/\/$/, '');
      const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (location.protocol === 'file:' || (isLocalhost && location.port !== '8082'))
        return 'http://localhost:8082';
      return location.origin;
    })();

    const sendBtn   = document.getElementById('send-reset');
    const phoneInput = document.getElementById('reset-phone');
    const errorEl   = document.getElementById('reset-phone-error');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }
    function clearError() {
      errorEl.style.display = 'none';
    }

    sendBtn.addEventListener('click', async function () {
      clearError();
      const phone = phoneInput.value.trim();

      // 格式驗證
      if (!phone) {
        showError('請輸入手機號碼');
        return;
      }
      if (!/^09\d{8}$/.test(phone)) {
        showError('手機號碼格式不正確，請輸入 09 開頭的 10 位數字');
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = '確認中…';

      try {
        // 先確認此手機是否已註冊
        const res  = await fetch(`${API_BASE}/api/auth/check-phone?phone=${encodeURIComponent(phone)}`);
        const data = await res.json();

        if (!data?.data) {
          showError('此手機號碼尚未註冊，請先建立帳號');
          return;
        }

        // 手機存在，帶手機號跳到驗證頁
        location.href = `verify-phone.html?type=reset&phone=${encodeURIComponent(phone)}`;

      } catch (err) {
        showError('查詢失敗，請確認網路連線後再試');
        console.error(err);
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = '發送驗證碼';
      }
    });

    // Enter 鍵觸發
    phoneInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault(); // 阻止 form submit 導致頁面刷新
        sendBtn.click();
      }
    });
  </script>

</body>

</html>
