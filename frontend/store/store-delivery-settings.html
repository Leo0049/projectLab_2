 <div id="mainContentFade" class="p-8 pt-0 opacity-0 transition-opacity duration-300">
 <div id="deliverySettingsRoot" class="max-w-5xl mx-auto w-full">
<section class="mb-8">
<h3 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-800">
<span class="material-symbols-outlined text-accent-orange">delivery_dining</span>
 外送設定
 </h3>
<div class="bg-white rounded-xl border border-slate-200 p-8 shadow-sm space-y-8">
<div class="flex items-start justify-between gap-6 max-w-2xl">
<div>
<label class="font-bold text-slate-700 block">是否開啟外送</label>
<p class="text-xs text-slate-400 mt-1">關閉後顧客將無法在前端選擇外送服務</p>
</div>
<label class="relative inline-flex items-center cursor-pointer shrink-0">
<input id="deliveryEnabledToggle" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-accent-orange"></div>
</label>
</div>

<div class="space-y-3 max-w-2xl" data-delivery-dependent-section>
<label class="font-bold text-slate-700 block">外送距離 (公里)</label>
<div class="relative">
<input id="maxDeliveryKm" class="w-full pr-12 pl-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-accent-orange focus:border-accent-orange transition-all font-medium text-slate-700" placeholder="請輸入公里數" step="0.1" type="number" data-delivery-dependent/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">km</span>
</div>
</div>
<div class="space-y-3 max-w-2xl" data-delivery-dependent-section>
<label class="font-bold text-slate-700 block">最低外送金額</label>
<div class="relative">
<input id="minDeliveryAmount" class="w-full pr-16 pl-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-accent-orange focus:border-accent-orange transition-all font-medium text-slate-700" placeholder="請輸入金額" step="1" min="0" type="number" data-delivery-dependent/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">元</span>
</div>
</div>
</div>
</section>
<section class="mb-8">
<h3 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-800">
<span class="material-symbols-outlined text-accent-orange">schedule</span>
 外送時間設定
 </h3>
<div class="bg-white rounded-xl border border-slate-200 p-8 shadow-sm" data-delivery-dependent-section>
<div class="grid grid-cols-1 md:grid-cols-2 gap-12 max-w-3xl">
<div class="space-y-3">
<label class="font-bold text-slate-700 block">外送開始時間</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400 z-10 pointer-events-none">history_toggle_off</span>
<input id="deliveryStartTime" class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-accent-orange focus:border-accent-orange transition-all font-medium text-slate-700" type="time" data-delivery-dependent/>
</div>
</div>
<div class="space-y-3">
<label class="font-bold text-slate-700 block">外送結束時間</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400 z-10 pointer-events-none">history_toggle_off</span>
<input id="deliveryEndTime" class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-accent-orange focus:border-accent-orange transition-all font-medium text-slate-700" type="time" data-delivery-dependent/>
</div>
</div>
</div>
<div class="mt-6 flex items-start gap-2 text-slate-400">
<span class="material-symbols-outlined text-sm mt-0.5">info</span>
<p class="text-xs italic">註：外送服務僅在上述時段內開放接單，與門市營業時間可分別設定。</p>
</div>
</div>
</section>
