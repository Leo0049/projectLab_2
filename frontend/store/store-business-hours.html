 <div id="mainContentFade" class="p-4 md:p-8 pt-0 opacity-0 transition-opacity duration-300">
 <div class="max-w-4xl mx-auto space-y-4 md:space-y-6">
 <!-- 營業時間主卡片 -->
 <section id="businessHoursSettings" class="bg-white dark:bg-slate-800 rounded-xl border border-primary/10 shadow-sm overflow-hidden">
 <div class="px-4 md:px-6 py-4 md:py-5 border-b border-primary/5 flex justify-between items-center bg-slate-50/30">
 <div>
 <h3 class="font-bold text-base md:text-lg flex items-center gap-2">
 <span class="material-symbols-outlined text-primary">schedule</span>
 營業時間設定
 </h3>
 <p class="text-[10px] md:text-xs text-slate-400 mt-0.5 font-medium">設定每週固定營業與公休時段</p>
 </div>
 </div>
 
 <div class="p-3 md:p-6 opacity-0 transition-opacity duration-200" id="businessHoursContainer">
 <div class="space-y-2 md:space-y-1" id="businessHoursRows">
 <!-- 星期一 ~ 星期日 -->
 <script>
 const dayLabels = { mon: '星期一', tue: '星期二', wed: '星期三', thu: '星期四', fri: '星期五', sat: '星期六', sun: '星期日' };
 const dayKeys = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
 
 dayKeys.forEach(day => {
 document.write(`
 <div class="group flex flex-col md:flex-row md:items-center gap-3 md:gap-8 py-3.5 px-3 md:px-4 rounded-xl hover:bg-slate-50 transition-colors border border-slate-50 md:border-transparent" data-day-row="${day}">
 <div class="flex items-center justify-between md:justify-start">
 <div class="w-20 font-bold text-slate-700 dark:text-slate-200 text-sm md:text-base">${dayLabels[day]}</div>
 <!-- Mobile 專用開關顯示 (與文字並排) -->
 <div class="md:hidden flex items-center gap-3">
 <span class="text-xs font-bold text-slate-500" data-day-closed-label-mob="${day}">店休</span>
 <label class="relative inline-flex items-center cursor-pointer">
 <input class="sr-only peer" type="checkbox" data-day-closed="${day}" />
 <div class="relative w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-500"></div>
 </label>
 </div>
 </div>
 
 <div class="flex items-center gap-3 md:flex-1">
 <div class="flex-1">
 <input class="w-full px-3 py-2 bg-slate-50 md:bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-xs md:text-sm font-bold outline-none" type="time" data-day-start="${day}" />
 </div>
 <span class="text-slate-300 font-bold text-xs md:text-sm">至</span>
 <div class="flex-1">
 <input class="w-full px-3 py-2 bg-slate-50 md:bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-xs md:text-sm font-bold outline-none" type="time" data-day-end="${day}" />
 </div>
 </div>
 
 <!-- Desktop 專用開關區域 -->
 <div class="hidden md:flex items-center gap-3 w-28 justify-end">
 <span class="text-sm font-bold text-slate-500" data-day-closed-label="${day}">店休</span>
 <label class="relative inline-flex items-center cursor-pointer">
 <input class="sr-only peer" type="checkbox" data-day-closed-desktop="${day}" />
 <div class="relative w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-500"></div>
 </label>
 </div>
 </div>
 `);
 });
 </script>
 </div>
 </div>
 </section>

 <div class="flex justify-end pt-4">

 儲存變更
 </button>
