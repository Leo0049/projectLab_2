 <div class="flex items-center gap-4">
 <button id="storeStatusToggle" type="button" data-status="loading" class="flex items-center bg-slate-100 px-4 py-2 rounded-lg border border-slate-200">

 <span id="storeStatusLabel" class="text-sm font-bold text-slate-500">讀取中...</span>
 </button>
 <button type="button" aria-label="通知" data-notifications-bell class="w-10 h-10 flex items-center justify-center rounded-lg bg-orange-100/50 text-primary relative">
 <span class="material-symbols-outlined">notifications</span>
 <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-white dark:border-background-dark hidden" data-notifications-dot></span>
 </button>

 </nav>
 </div>
 </div>

 <div id="overviewReportContainer" class="p-4 md:p-8">

 <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
 <div class="bg-white dark:bg-slate-900 p-4 md:p-6 rounded-2xl border border-primary/10 shadow-sm">

 <h3 class="text-2xl md:text-3xl font-black" data-report-revenue>&nbsp;</h3>
 </div>
 <div class="bg-white dark:bg-slate-900 p-4 md:p-6 rounded-2xl border border-primary/10 shadow-sm">

 <h3 class="text-2xl md:text-3xl font-black" data-report-orders>&nbsp;</h3>
 </div>
 <div class="bg-white dark:bg-slate-900 p-4 md:p-6 rounded-2xl border border-primary/10 shadow-sm">
 <p class="text-xs font-bold text-slate-400 uppercase mb-1">平均客單價</p>
 <h3 class="text-2xl md:text-3xl font-black" data-report-aov>&nbsp;</h3>
 </div>
 </div>

 <div class="bg-white dark:bg-slate-900 p-4 md:p-8 rounded-xl border border-slate-200 shadow-sm">

 <div class="flex gap-2">
 <button id="toggleThisWeek" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-primary/10 text-primary text-xs font-bold border border-primary/20">
 <span class="size-3 rounded-full bg-primary"></span>
 <span>本週</span>
 </button>
 <button id="toggleLastWeek" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-50 text-slate-400 text-xs font-bold border border-slate-100">
 <span class="size-3 rounded-full bg-slate-300"></span>
 <span>上週</span>
 </button>
 </div>
 </div>
 <div class="h-[240px] md:h-[300px] w-full"><canvas id="salesTrendsChart"></canvas></div>
 </div>
